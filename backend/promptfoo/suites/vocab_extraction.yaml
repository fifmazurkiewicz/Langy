# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: vocab_extraction prompt regression

providers:
  - id: python:../providers/mock_provider.py

prompts:
  - file://../prompts/vocab_extraction.txt

tests:
  - vars:
      transcript: "User: I love travel. Agent: Great!"
    assert:
      - type: javascript
        value: |
          const o = typeof output === 'string' ? JSON.parse(output) : output;
          return Array.isArray(o.candidates) && o.candidates.length >= 1;



