# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: selection_translate prompt regression

providers:
  - id: python:../providers/mock_provider.py

prompts:
  - file://../prompts/selection_translate.txt

tests:
  - vars:
      span: hello
    assert:
      - type: javascript
        value: |
          const o = typeof output === 'string' ? JSON.parse(output) : output;
          return !!(o.translation_pl && o.example_l2);



